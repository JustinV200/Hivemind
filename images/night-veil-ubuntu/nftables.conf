# night-veil-ubuntu kill-switch (roadmap step 5.3a).
#
# Default drop on every chain: nothing leaves this Cell except what is explicitly named below.
# Loaded by night-veil-kill-switch.service, before openvpn-client@ and tor ever start (see
# README.md's "Boot ordering" section) -- the kill-switch is in force before there is anything to
# leak, not applied after the fact.
#
# What each rule is for (hivemind.hive.night_veil.session_commands.CMD_KILL_SWITCH checks this
# ruleset is loaded; CMD_DEFAULT_ROUTE, direct_egress_cmd and metadata_cmd check what it actually
# blocks):
#
#   - Loopback is always allowed: the Warden talks to Tor's own SOCKS (127.0.0.1:9050) and control
#     (127.0.0.1:9051) ports over it, and Tor's own DNS resolution (when it does any) never leaves
#     the box either.
#   - Established/related connections are allowed to keep flowing without re-matching every rule
#     below -- standard stateful-firewall practice, not a hole: a *new* connection still needs one
#     of the rules below to ever reach ESTABLISHED in the first place.
#   - The OpenVPN client itself (matched by the `openvpn` user its own systemd unit runs it as,
#     never by a hardcoded server address -- the operator's own profile decides that, mounted at
#     runtime) may dial out on the physical interface: this is the one rule that has to exist
#     *before* tun0 does, so the tunnel can come up at all.
#   - Once tun0 exists, only the Tor daemon's own outbound connections (matched by the
#     `debian-tor` user its own Debian/Ubuntu package runs it as -- Tor relay and directory-server
#     addresses have no fixed list, so process identity is what is enforced, not a destination) may
#     use it. Every other process's attempt to reach the network through the tunnel is refused.
#   - Cloud metadata addresses are refused explicitly, redundantly on top of the default-drop
#     policy (which would already block them): 169.254.169.254 covers AWS, Azure, GCP and
#     DigitalOcean alike, and 169.254.0.0/16 covers the wider link-local range a rarer provider
#     might use. `night-veil-kill-switch.service` also adds a blackhole route for the same address
#     (README.md's "Location-blind defaults" section), so the endpoint is unreachable two ways.
#
# Everything else -- any other process, any other interface, any DNS query that is not Tor's own
# loopback resolution -- falls through to each chain's own `policy drop`. This is what
# hivemind.hive.night_veil.session_commands.direct_egress_cmd, metadata_cmd and dns_leak_free's own
# CMD_DNS_PROBE check: a direct curl or a metadata request must fail, and no nameserver outside
# what OpenVPN itself configured (README.md's own note: this image trusts resolvconf, not a
# hardcoded resolver address, since that address is the operator's VPN provider's own choice).

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # Never a router: nothing this Cell runs needs to forward another host's traffic.
    }

    chain output {
        type filter hook output priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        # Metadata endpoints: explicit refusal, redundant with the default-drop policy below and
        # with the blackhole route night-veil-kill-switch.service also adds (defense in depth).
        ip daddr 169.254.0.0/16 drop
        ip daddr 168.63.129.16 drop

        # OpenVPN's own handshake, before tun0 exists (matched by process identity, not address).
        meta skuid "openvpn" accept

        # Tor's own traffic over the tunnel, once it is up (matched by process identity: Tor
        # relay/directory addresses have no fixed list to name here instead).
        oifname "tun0" meta skuid "debian-tor" accept

        # Nothing else ever reaches the default-drop policy's own log; codingrules section 12
        # forbids retaining anything beyond identifiers and sizes, and a per-packet drop log would
        # be exactly the kind of session-content record Night Veil must never keep.
    }
}
