# Drop-in for the openvpn package's own openvpn-client@.service (roadmap step 5.3a), installed at
# /etc/systemd/system/openvpn-client@.service.d/override.conf. Orders OpenVPN after the
# kill-switch is loaded (nftables -> openvpn -> tor -> the Warden, codingrules section 8.7): the
# tunnel must never come up before the default-drop ruleset that constrains what it may carry.
[Unit]
Requires=night-veil-kill-switch.service
After=night-veil-kill-switch.service
