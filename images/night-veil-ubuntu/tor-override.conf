# Drop-in for the tor package's own tor.service (roadmap step 5.3a), installed at
# /etc/systemd/system/tor.service.d/override.conf. Orders Tor after the OpenVPN client that
# carries its own traffic (nftables -> openvpn -> tor -> the Warden, codingrules section 8.7).
[Unit]
Requires=night-veil-kill-switch.service openvpn-client@night-veil.service
After=night-veil-kill-switch.service openvpn-client@night-veil.service
