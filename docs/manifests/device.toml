# Device manifest: what the Warden on a colonized Swarm device (Level 1 of the runtime ladder,
# ADR-0052) is configured from. The operator writes it on the device and records its path with
# `pollen install --warden-manifest <this file>`; the Pollen Packet hands it to the Warden it
# starts (HIVEMIND_DEVICE_MANIFEST), and nothing else in the Hive reads it.
#
# It holds [llm], in exactly the shape the Hive Manifest's own [llm] section has
# (docs/manifests/full.toml documents every field), so an operator can copy the section from the
# Hive's manifest and change the base URLs to what the device can reach, and, for a device that
# could become a Nuc, the [forage.map] rows of the models its servers may load (below). It may also
# hold [supervision] (last in this file): how long the Warden waits for the Queen when its link is
# cut, and how much of that wait it may spend finding out why. Any other section is refused rather
# than ignored. The rules that keep a Hive Manifest's slot table honest
# apply here too: every model slot is bound, every binding names a declared provider, and
# `offline = true` accepts only loopback providers.
#
# There is no [exoskeleton] table. Whether a task may be given a display depends on the device
# (the programs on its PATH, and the access level the operator granted it) and not on this file;
# the Warden attaches one with a Virtual Cell's defaults, a 1280x800 screen and a 30 s budget for
# it to come up (docs/runbooks/enrolling-a-device.md, "A device that can run a desktop").
#
# A provider's API key is never in this file. The Warden reads it from the device's own
# environment, in the variable the provider names (api_key_env), which the packet inherits from
# the service that starts it; keys never travel over the wire.

[llm]
offline = false

# A model source the Hive shares, reachable from this device. The name must match the provider
# the Hive's grants name (a grant crosses the wire as a provider name, never a URL), so it is
# resolved here to an address this device can reach.
[llm.providers.shared]
kind = "openai_compat"
base_url = "http://hive-stand.example.lan:1234/v1"
api_key_env = "HIVEMIND_SHARED_API_KEY"
timeout_s = 120.0
seats = 2

# This device's own model server, loopback only. Declared so the Warden can report it to the
# Queen, who may later promote the device to a Nuc (Level 2) and ask for exactly this server to
# be started; nothing starts at Level 1.
[llm.providers.local]
kind = "openai_compat"
base_url = "http://127.0.0.1:8081/v1"
timeout_s = 60.0
seats = 1

# Every ModelSlot must be bound. A device's bees mostly use the worker and warden slots; the rest
# are bound too so the table is complete, and only ever called if a grant routes a call here.
[llm.slots.queen]
provider = "shared"
model = "claude-opus-5"
effort = "HIGH"

[llm.slots.judge]
provider = "shared"
model = "claude-opus-5"
effort = "HIGH"

[llm.slots.attendant]
provider = "shared"
model = "claude-haiku-4-5"
effort = "LOW"

[llm.slots.ripener]
provider = "shared"
model = "claude-haiku-4-5"
effort = "LOW"

[llm.slots.warden]
provider = "shared"
model = "claude-sonnet-5"
effort = "MEDIUM"

[llm.slots.worker]
provider = "shared"
model = "claude-sonnet-5"
# Where the worker slot goes when the shared source is unreachable, and, once this device is a
# Nuc, where its sub-bees go first: the model server below, through the "local" provider. Without
# a binding like this a Nuc's model is on the Forage map but no slot ever reaches it.
fallback = "local_worker"
effort = "MEDIUM"

[llm.slots.local_worker]
# A named binding: legal as a [llm.slots] key without being a ModelSlot, because the worker slot's
# fallback names it.
provider = "local"
model = "llama3.1:8b"
effort = "MEDIUM"

[llm.slots.scaffolder]
provider = "shared"
model = "claude-sonnet-5"
effort = "MEDIUM"

[llm.slots.embedder]
provider = "shared"
model = "nomic-embed-text"
effort = "LOW"

[llm.slots.transcriber]
provider = "shared"
model = "whisper-large-v3"
effort = "LOW"

# A model server the Warden may start on this device once it is a Nuc. The table key is the
# server id the Warden reports in its capacity report; the Queen can only start a server named
# there, and only if the Hive's own manifest lists the same server id in its [llm.servers] (with
# load_on_start = false, so the Hive Stand never starts a copy) and names the models it may load.
# `sources` names the [forage.map] entries the server may load; their rows follow, copied from
# the Hive's manifest, because the Warden must know what each model is to offer it.
# `load_on_start = false`: nothing starts until the Queen promotes the device.
[llm.servers.local_llama]
provider = "local"
argv = ["llama-server", "--port", "{port}", "--model", "{scratch}/weights/llama-8b.gguf"]
port = 8081
health_path = "/models"
startup_timeout_s = 120.0
sources = ["local_llama"]
load_on_start = false

[forage.map.local_llama]
# The model this server serves, as the Hive's [forage.map.local_llama] describes it. The provider
# must be the server's own; a host is never named here (the Warden fills in its own Cell).
provider = "local"
model = "llama3.1:8b"
grade = 2
context_window = 8192
capabilities = ["json_mode"]
seats = 2
# About 8 GiB of VRAM; leave it out for a model that runs on the CPU and needs none. The Queen
# promotes a device only if this fits the VRAM it has free.
vram_bytes_required = 8589934592

# How long this device's Warden waits when its link to the Queen is cut, and what it may spend of
# that wait finding out why (roadmap 11.9a, ADR-0056). Leave the table out and the Hive's shipped
# defaults hold: ten minutes, and a budget of two Drones in five. The Queen keeps her own
# `[supervision] max_offline_s` in the Hive's manifest (how long she waits for a Nuc before she
# places its tasks afresh); this one is the device's, read only by its Warden, and an operator who
# changes one should look at the other.
[supervision]
# Seconds the link may stay down before the Warden clusters fully: every bee paused at a Handoff
# and its shared grants given up, whatever the Warden is still able to think with.
max_offline_s = 600.0

# Carved out of max_offline_s, never added to it: wall_clock_s must be below the limit above, or
# the file is refused at load. A Warden with a model server of its own sends a diagnostic Drone
# when it finds its link gone, up to `attempts` of them one after another; the whole search ends
# `wall_clock_s` after the link went, whatever it has found, so clustering keeps the deadline the
# limit above sets.
[supervision.reconnect_budget]
attempts = 2
wall_clock_s = 300.0
