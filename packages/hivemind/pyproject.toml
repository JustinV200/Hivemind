[project]
name = "hivemind"
version = "0.1.0.dev0"
description = "The Queen and every control-plane subsystem: the Hive's orchestrator, memory, policy, and Entrance."
requires-python = ">=3.12"
dependencies = [
    "waggle",           # Ids, the clock, the loop shape and every wire message (codingrules section 4).
    "pydantic>=2",      # Boundary validation for the Hive Manifest, tasks, and every crossing point.
    "structlog",        # Structured logging: JSON in production, pretty in dev (codingrules section 12).
    "typer",            # The `hive` CLI's command layer.
    "httpx",            # The OpenAI-compatible adapter's client and, later, the Entrance and the http tool (codingrules 8.6).
    "anthropic",        # The Anthropic adapter's SDK; imported only under llm/providers/anthropic/ (codingrules 8.6).
    "sqlite-vec>=0.1.6,<0.2",  # The Honey Store's vector distance functions, loaded into SQLite (ADR-0035); 0.1.6 added the metadata filtering 0.1.x relies on.
]

[project.optional-dependencies]
# roadmap step 5.4: the Docker Engine SDK for Python, imported only inside
# hive/backends/docker/sdk_client.py (and lazily, only inside its __init__ -- that module's own
# docstring), so installing hivemind never requires Docker itself. `uv sync --extra docker` (or
# `hivemind[docker]` from another project) pulls this in for a real DockerCellBackend.
docker = [
    "docker>=7,<8",  # 7.x is the current major; pin the major only, like every other dependency here.
]
# roadmap step 6.11 (ADR-0031): Playwright drives the Exoskeleton's browser fast path over CDP. It
# is imported only inside hivemind.exoskeleton.browser.playwright, lazily, so a terminal-only Hive
# never needs it; `uv sync --extra browser` (or `hivemind[browser]`) pulls it in. Its bundled
# driver runs beside the bee; the browser itself is started on the Cell through its CellSession.
browser = [
    "playwright>=1.56,<2",  # 1.56 is the release whose Chromium build (141) the dev images carry.
]
# roadmap step 6.5a (ADR-0033): faster-whisper runs Whisper in process for ModelSlot.TRANSCRIBER.
# Optional because it pulls a native inference runtime (CTranslate2) a terminal-only Hive never
# loads; imported only inside hivemind.llm.providers.whisper (codingrules 8.6).
whisper = [
    "faster-whisper>=1.1,<2",  # 1.1 is the first release with the batched pipeline and VAD defaults we rely on.
]
# roadmap step 7.1 (ADR-0036): the in-process EMBEDDER adapter, imported only inside
# hivemind.llm.providers.sentence_transformers (and lazily, only when a provider of that kind is
# built), so a Hive that embeds on its model server never downloads a deep learning framework.
# `uv sync --extra embeddings` (or `hivemind[embeddings]`) pulls it in.
embeddings = [
    "sentence-transformers>=3,<6",  # 3.x introduced the encode() keyword set the adapter uses; 5.x is current.
]

[tool.uv.sources]
waggle = { workspace = true }  # Resolve waggle from this workspace, not from an index.

[project.scripts]
# Registers the `hive` command, backed by the composition root added in roadmap step 0.6.
hive = "hivemind.cli.app:main"
# Registers the in-Cell Warden entry point (roadmap step 5.5): images/base-ubuntu's ENTRYPOINT
# invokes this to connect a Virtual Cell out to the Queen; see hivemind.cli.in_cell's own README.
hivemind-in-cell = "hivemind.cli.in_cell.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
