<!doctype html>
<!--
  The fixture site's page behind the login: it greets whoever the session names, and sends a
  visitor with no session back to the login page. Mirrored by
  hivemind.exoskeleton.browser.fake.login.login_site(); change both together.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome - HiveMind fixture</title>
  <script>
    "use strict";
    // The guard runs in <head>, before anything renders: without a session this page is never
    // shown, the way a real site's protected page redirects to its login.
    if (!localStorage.getItem("session")) {
      location.replace("login.html");
    }
  </script>
</head>
<body>
  <main>
    <h1 id="greeting">Welcome</h1>
    <p>You are logged in to the HiveMind fixture site.</p>
  </main>
  <script>
    "use strict";
    // The heading names the session's user, so "Welcome, alice" appears only once logged in.
    const user = localStorage.getItem("session");
    if (user) {
      document.getElementById("greeting").textContent = "Welcome, " + user;
    }
  </script>
</body>
</html>
